<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimuZ Firmware Update Tool</title>
  <meta name="description" content="Outil web de flash firmware ESP32 pour SimuZ" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script type="module" src="app.js" defer></script>
</head>
<body>
  <div class="page-noise" aria-hidden="true"></div>

  <main class="container">
    <header>
      <div class="logo">
        <span>⚡</span>
        <h1>SimuZ Firmware Update Tool</h1>
      </div>
      <p class="subtitle">
        Connecte ton ESP32, choisis ton bundle firmware, puis lance le flash en un clic.
      </p>
    </header>

    <section class="steps">
      <!-- STEP 1 -->
      <article id="stepConnect" class="step active">
        <div class="step-header">
          <div class="step-number">1</div>
          <h2>Connexion ESP32</h2>
          <div id="statusBadge" class="status-badge disconnected">⚪ Non connecté</div>
        </div>

        <div class="actions-row">
          <button id="connectBtn" class="btn btn-primary" type="button">Connecter</button>
          <button id="disconnectBtn" class="btn btn-danger" type="button" disabled>Déconnecter</button>
        </div>
      </article>

      <!-- STEP 2 -->
      <article id="stepFile" class="step">
        <div class="step-header">
          <div class="step-number">2</div>
          <h2>Sélection du firmware</h2>
        </div>

        <div class="select-row">
          <label class="select-label" for="softwareType">Type de software</label>
          <select id="softwareType" class="select-input">
            <option value="">-- Sélectionner un type --</option>
            <option value="formula">1. Formula</option>
            <option value="simple_emulator">2. Simple Emulator</option>
            <option value="universal_beta">3. Universal (Beta)</option>
            <option value="full_gt_beta">4. Full GT (Beta)</option>
            <option value="custom">5. Flash My Custom Software</option>
          </select>
        </div>

        <div class="select-row" id="versionRow">
          <label class="select-label" for="softwareVersion">Version</label>
          <select id="softwareVersion" class="select-input" disabled>
            <option value="">-- Sélectionner une version --</option>
          </select>
        </div>

        <div id="customZipPicker" style="display:none;">
          <label class="file-label" for="fileBundle">Bundle custom (.zip)</label>
          <input id="fileBundle" type="file" accept=".zip,application/zip" />
        </div>

        <p id="selectedBundleName" class="file-name">Aucun bundle sélectionné</p>
        <div id="bundleStatus" class="bundle-status"></div>
      </article>

      <!-- STEP 3 -->
      <article id="stepFlash" class="step">
        <div class="step-header">
          <div class="step-number">3</div>
          <h2>Flash firmware</h2>
        </div>

        <div class="actions-row">
          <button id="flashBtn" class="btn btn-success" type="button" disabled>Flasher</button>
        </div>

        <div id="progressWrap" class="progress-wrap">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </article>
    </section>

    <pre id="logBox" class="log-box"></pre>

    <footer class="footer">
      SimuZ • ESP32 Web Flasher
    </footer>
  </main>
</body>
</html>
